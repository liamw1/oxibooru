{% extends "layout.html" %}

{% block title %}{{ ctx.site_name() }} &ndash; Tag #{{ tag.primary_name()? }}{% endblock %}

{% block main %}
<style>
    {% for category in categories %}
    .tag-{{ category.name()? }} { color: {{ category.color()? }}; }
    {% endfor %}
</style>

<div class="content-wrapper" id="tag">
    {% block tag %}
    <h1>{{ tag.primary_name()? }}</h1>
    <nav class="buttons">
        <ul>
            <li data-name="summary" {% if active_tag_tab==TagTab::Summary %} class="active" {% endif %}>
                <a href="tag/{{ tag.primary_name()? }}">Summary</a>
            </li>
            <li data-name="edit" {% if active_tag_tab==TagTab::Edit %} class="active" {% endif %}>
                <a href="tag/{{ tag.primary_name()? }}/edit">Edit</a>
            </li>
            <li data-name="merge" {% if active_tag_tab==TagTab::Merge %} class="active" {% endif %}>
                <a href="tag/{{ tag.primary_name()? }}/merge">Merge with&hellip;</a>
            </li>
            <li data-name="delete" {% if active_tag_tab==TagTab::Delete %} class="active" {% endif %}>
                <a href="tag/{{ tag.primary_name()? }}/delete">Delete</a>
            </li>
        </ul>
    </nav>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}
</div>
{% endblock %}
